</style></head><body><header><div><span class="logo" aria-hidden="true"><i></i><i></i><i></i></span><b class="word">交錯拍點</b><span class="en">POLYRHYTHM LAB</span><nav class="tabs push"><button id="practiceTab" class="sel">練習台</button><button id="lessonsTab">練習課程</button></nav></div></header><main><section id="practice"><div class="bar"><h1 id="title">自由練習</h1><output class="push slim" id="status">準備就緒</output></div><div class="studio"><section class="panel scope"><div class="bar"><div><span class="en">RHYTHM SCOPE</span><div class="ratio"><b id="bigA">3</b> : <b id="bigB">2</b></div></div><button id="view">環形視圖</button></div><canvas id="scope" role="img" aria-label="同一循環的 A 軌與 B 軌拍點"></canvas><div class="bar total slim"><div class="legend"><span class="a">● A 軌</span><span class="b">◆ B 軌</span><span>◎ 重合</span></div><output id="period"></output></div></section><section class="panel side"><div class="selects"><h2>播放控制</h2><label>節奏比例<select id="ratio"><option>3:2</option><option>4:3</option><option>5:4</option><option>5:3</option><option>7:4</option><option>自訂</option></select></label><div class="fieldrow" id="custom" hidden></div><label>B 軌 BPM<input id="tempo" type="number" min="30" max="200" value="60"></label><label>練習模式<select data-key="mode"></select></label></div><p class="slim" id="scoring"></p><div class="buttons"><button class="primary" id="play">▶ 播放</button><button id="stop">停止</button><button id="restart" aria-label="重新開始">↺</button></div></section></div><div class="bar"><h2>敲擊練習</h2><output class="push slim" id="counter">第 0 循環</output></div><div class="pads"><button class="pad" data-pad="A"><kbd>F</kbd><b>● 左手 A</b><output id="feedA">待敲擊</output></button><button class="pad" data-pad="B"><kbd>J</kbd><b>◆ 右手 B</b><output id="feedB">待敲擊</output></button></div><div class="results"><div><b class="a">A 軌表現</b><p class="slim" id="resultA"></p></div><div><b class="b">B 軌表現</b><p class="slim" id="resultB"></p></div></div><details><summary>聲部與進階設定</summary><div class="options" id="settings"></div><div class="buttons"><button id="swap">交換音色</button><button id="cal">開始延遲校準</button><button id="calTap" hidden>跟著聲音敲擊</button></div><p id="calHelp" class="slim">裝置、藍牙與觸控延遲都會影響讀值。校準會用八次跟拍估算輸入補償。</p></details><details><summary>我的練習與紀錄</summary><div class="buttons"><input id="name" aria-label="自訂練習名稱" placeholder="自訂練習名稱"><button id="save">儲存設定</button><button id="export">匯出 JSON</button><button id="import">匯入 JSON</button><button id="clear">清除練習紀錄</button><input type="file" id="file" accept=".json" hidden></div><div id="archive"></div></details></section><section id="lessons" hidden><h1>練習課程</h1><div class="lessonlist" id="lessonlist"></div></section><p class="msg" aria-live="polite" id="msg"></p></main><script>const defaults={a:3,b:2,bpm:60,mode:'跟奏',hand:'A',tolerance:65,count:2,limit:0,quiet:2,offset:0,grid:true,ring:false,reduced:false,ramp:false,increment:3,stage:4,max:120,volA:70,volB:65,toneA:'木魚',toneB:'短音',muteA:false,muteB:false};
const limits={a:[1,12],b:[1,12],bpm:[30,200],tolerance:[30,100],count:[0,8],limit:[0,256],quiet:[1,16],offset:[-250,250],increment:[1,30],stage:[1,32],max:[30,200],volA:[0,100],volB:[0,100]};
const choices={mode:['跟奏','單手','雙手','靜音挑戰'],hand:['A','B'],toneA:['木魚','短音','點擊'],toneB:['木魚','短音','點擊']};
function validConfig(c){return !!c&&Object.keys(defaults).every(k=>limits[k]?Number.isInteger(c[k])&&c[k]>=limits[k][0]&&c[k]<=limits[k][1]:choices[k]?choices[k].includes(c[k]):typeof c[k]==='boolean')&&[30,65,100].includes(c.tolerance)}
function duration(c){return c.b*60/c.bpm}
function gcd(a,b){return b?gcd(b,a%b):a}
function makeCycle(c,start,n){const cfg={...c},length=duration(cfg),events=[];for(const h of ['A','B']){const count=cfg[h.toLowerCase()],spacing=length/count;for(let i=0;i<count;i++)events.push({h,t:start+i*spacing,spacing,scored:c.mode!=='單手'||h===c.hand,played:false,result:null})}return {cfg,start,end:start+length,n,events}}
function nextConfig(c,changes,n){const v={...c,...changes};if(v.ramp&&changes.bpm===undefined&&n%v.stage===0)v.bpm=Math.max(v.bpm,Math.min(v.max,v.bpm+v.increment));return v}
function stats(){return {A:{hits:0,miss:0,extra:0,abs:0,sum:0,taps:0},B:{hits:0,miss:0,extra:0,abs:0,sum:0,taps:0}}}
function matchTap(events,h,time,tol,s){s.taps++;let best=null,delta=Infinity;for(const e of events){if(e.h!==h||!e.scored)continue;const diff=Math.abs(e.t-time);if(diff<Math.min(.22,e.spacing*.49999)&&diff<delta){best=e;delta=diff}}if(!best||best.result==='hit'){s.extra++;return '多敲'}const d=(time-best.t)*1000;if(Math.abs(d)>tol){s.extra++;return (d<0?'偏早 ':'偏晚 ')+Math.round(d)+' ms'}if(best.result==='miss'){s.extra++;return '逾時'}best.result='hit';s.hits++;s.abs+=Math.abs(d);s.sum+=d;return '準確 '+(d>0?'+':'')+Math.round(d)+' ms'}
function expire(events,now,tol,s){for(const e of events)if(e.scored&&e.result===null&&now>e.t+Math.min(tol/1000,e.spacing*.49999)){e.result='miss';s[e.h].miss++}}
function scoreText(s){if(!s.taps)return '尚無資料';const pct=Math.round(100*s.hits/Math.max(1,s.hits+s.miss));const bias=s.hits?Math.round(s.sum/s.hits):0;return pct+'% 命中 · 平均絕對誤差 '+(s.hits?Math.round(s.abs/s.hits)+' ms':'—')+' · '+(s.hits?(bias===0?'平均同步':(bias<0?'平均偏早 ':'平均偏晚 ')+Math.abs(bias)+' ms'):'無偏差資料')+' · 漏拍 '+s.miss+' · 多敲 '+s.extra}
function validStats(s){return s&&['A','B'].every(h=>s[h]&&['hits','miss','extra','abs','sum','taps'].every(k=>Number.isFinite(s[h][k])&&(k==='sum'||s[h][k]>=0)))}
function validDB(d){return d?.version===1&&validConfig(d.config)&&Array.isArray(d.saved)&&Array.isArray(d.history)&&d.saved.every(x=>typeof x?.name==='string'&&validConfig(x.cfg))&&d.history.every(x=>Number.isFinite(x?.date)&&Number.isFinite(x.seconds)&&validConfig(x.cfg)&&validStats(x.stats))}
const $=id=>document.getElementById(id),key='polyrhythm-lab-v1';
let db={version:1,config:{...defaults,reduced:matchMedia('(prefers-reduced-motion:reduce)').matches},saved:[],history:[]};
try{const raw=JSON.parse(localStorage.getItem(key));if(validDB(raw))db=raw}catch{}
let cfg=db.config,session=null,ctx=null,bus=null,timer=null,frame=0,generation=0,cycles=[],pending={},lastStats=stats(),cal=null,active=false,paused=false,finalTime=0,lessonName='自由練習',custom=false;
function message(m){$('msg').textContent=m}
function persist(){try{localStorage.setItem(key,JSON.stringify(db))}catch{message('瀏覽器無法儲存，請匯出 JSON 保留紀錄。')}}
async function audio(){if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();ctx.onstatechange=()=>{if(session&&active&&ctx.state!=='running'){active=false;paused=true;refresh()}}}await ctx.resume()}
function tone(t,track,c,volume){if(!ctx||!bus||volume<=0)return;const style=c['tone'+track],osc=ctx.createOscillator(),g=ctx.createGain(),f=(style==='木魚'?900:style==='短音'?520:1550)*(track==='B'?.78:1),len=style==='短音'?.105:.048;osc.type=style==='點擊'?'square':style==='木魚'?'sine':'triangle';osc.frequency.setValueAtTime(f,t);osc.frequency.exponentialRampToValueAtTime(f*.62,t+len);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(Math.max(.002,volume*.002),t+.002);g.gain.exponentialRampToValueAtTime(.0001,t+len);osc.connect(g);g.connect(bus);osc.start(t);osc.stop(t+len+.003);osc.onended=()=>{osc.disconnect();g.disconnect()};return osc}
function freshBus(){if(bus)bus.disconnect();bus=ctx.createGain();bus.connect(ctx.destination)}
function nowCycle(t){return cycles.find(c=>t>=c.start&&t<c.end)|| (cycles.length&&t<cycles[0].start?cycles[0]:cycles.at(-1))}
function tick(){if(!active||!session)return;const t=ctx.currentTime,horizon=t+.12;let last=cycles.at(-1);
while(last.end<=horizon&&(!cfg.limit||last.n+1<cfg.limit)){const n=last.n+1;const next=makeCycle(nextConfig(last.cfg,pending,n),last.end,n);pending={};cycles.push(next);last=next}
for(const q of session.counts)if(!q.played&&q.t<=horizon){q.played=true;if(q.t>=t-.015)tone(Math.max(t,q.t),'B',defaults,55)}
for(const c of cycles){for(const e of c.events){if(e.played||e.t>horizon)continue;e.played=true;const silent=c.cfg.mode==='靜音挑戰'&&Math.floor(c.n/c.cfg.quiet)%2===1;const guide=c.cfg.mode==='單手'?e.h!==c.cfg.hand:c.cfg.mode==='雙手'?false:true;if(guide&&!silent&&!cfg['mute'+e.h]&&e.t>=t-.015)e.node=tone(Math.max(t,e.t),e.h,cfg,cfg['vol'+e.h])}
expire(c.events,t-cfg.offset/1000,c.cfg.tolerance,session.stats)}
while(cycles.length>2&&cycles[0].end<t-.6)cycles.shift();
if(cfg.limit&&last.n+1>=cfg.limit&&t>last.end+Math.max(.01,cfg.offset/1000+.12)){finish(true);return}
const cur=nowCycle(t);const position=t<session.start?-1:cur?.n;if(cur&&session.visible!==position){session.visible=position;refresh()}feedback()}
function change(key,value){if(!session){cfg[key]=value;persist();refresh();return}
if(['a','b','bpm','ramp','increment','stage','max'].includes(key)){
const t=ctx.currentTime;const cur=nowCycle(t);while(cycles.at(-1).n>cur.n){const next=cycles.pop();for(const e of next.events)if(e.node)try{e.node.stop(t)}catch{};for(const k of ['a','b','bpm','ramp','increment','stage','max'])if(cfg[k]!==cur.cfg[k]&&pending[k]===undefined)pending[k]=cfg[k]}
pending[key]=value;cfg[key]=value;
}else if(['toneA','toneB','volA','volB','muteA','muteB','offset','ring','grid','reduced'].includes(key))cfg[key]=value;
else{finish(false);cfg[key]=value}persist();refresh()}
async function start(){if(session&&!paused)return;const gen=++generation;try{await audio();if(gen!==generation)return;if(paused&&session){paused=false;active=true;tick();refresh();animate();return}
if(cal)cancelCal();freshBus();active=true;paused=false;const base=ctx.currentTime+.08,startAt=base+cfg.count*60/cfg.bpm;session={cfg:{...cfg},start:startAt,stats:stats(),visible:-1,counts:Array.from({length:cfg.count},(_,i)=>({t:base+i*60/cfg.bpm,played:false}))};cycles=[makeCycle(cfg,startAt,0)];pending={};for(const h of ['A','B'])$('feed'+h).textContent='待敲擊';timer=setInterval(tick,22);tick();refresh();animate()}catch{message('無法啟動音訊，請確認瀏覽器的聲音權限並再按播放。')}}
async function pause(){if(!session||!active)return;active=false;paused=true;cancelAnimationFrame(frame);await ctx.suspend();refresh()}
function finish(natural=false){generation++;if(bus){bus.disconnect();bus=null}clearInterval(timer);cancelAnimationFrame(frame);if(session){const s=session,stopAt=Math.min(ctx.currentTime,natural?cycles.at(-1).end:Infinity);lastStats=s.stats;const seconds=Math.max(0,stopAt-s.start);if(seconds>0){db.history.unshift({date:Date.now(),seconds,cfg:s.cfg,stats:s.stats});persist()}session=null}active=false;paused=false;cycles=[];pending={};refresh();archive()}
function tap(h){if(cal){calTap();return}const el=$('feed'+h);if(!active||!session){el.textContent='先按播放';return}const t=ctx.currentTime-cfg.offset/1000,c=nowCycle(t);if(t<session.start-.12){el.textContent='預備拍';return}if(c.cfg.mode==='單手'&&c.cfg.hand!==h){el.textContent='參考軌';return}tick();if(!session)return;el.textContent=matchTap(cycles.flatMap(c=>c.events),h,t,c.cfg.tolerance,session.stats[h]);if(!cfg.reduced){const pad=el.parentElement;pad.classList.add('flash');setTimeout(()=>pad.classList.remove('flash'),90)}feedback()}
function feedback(){const s=session?.stats||lastStats;for(const h of ['A','B'])$('result'+h).textContent=scoreText(s[h])}
function animate(){cancelAnimationFrame(frame);if(!active)return;draw();frame=requestAnimationFrame(animate)}
function draw(){const cv=$('scope'),width=cv.clientWidth,height=cv.clientHeight;if(!width)return;const dpr=window.devicePixelRatio||1;if(cv.width!==Math.round(width*dpr)||cv.height!==Math.round(height*dpr)){cv.width=Math.round(width*dpr);cv.height=Math.round(height*dpr)}const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,width,height);const t=ctx?.currentTime||0,cycle=nowCycle(t),c=cycle?.cfg||cfg;let phase=cycle?Math.max(0,Math.min(1,(t-cycle.start)/duration(c))):0;if(cfg.reduced)phase=Math.floor(phase*c.b)/c.b;const div=c.a*c.b/gcd(c.a,c.b),pad=20,w=width-pad*2;
function line(x1,y1,x2,y2,color){x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.strokeStyle=color;x.stroke()}
function dot(px,py,h,joint){x.save();x.translate(px,py);x.fillStyle=h==='A'?'#91e5ca':'#beaafa';x.beginPath();if(h==='A')x.arc(0,0,6,0,7);else{ x.moveTo(0,-7);x.lineTo(7,0);x.lineTo(0,7);x.lineTo(-7,0);x.closePath()}x.fill();if(joint){x.beginPath();x.arc(0,0,10,0,7);x.strokeStyle='#fff0d6';x.stroke()}x.restore()}
const cx=width/2,cy=height/2,r=height*.39;for(const [i,h] of ['A','B'].entries()){const n=c[h.toLowerCase()],y=height*(.31+i*.38),rad=r*(1-i*.38);if(cfg.ring){x.beginPath();x.arc(cx,cy,rad,0,7);x.strokeStyle='#4c5562';x.stroke()}else{line(pad,y,pad+w,y,'#58616e');if(cfg.grid)for(let k=0;k<=div;k++)line(pad+w*k/div,y-12,pad+w*k/div,y+12,'#39454f')}
for(let k=0;k<n;k++){const ang=k/n*Math.PI*2-Math.PI/2;dot(cfg.ring?cx+Math.cos(ang)*rad:pad+w*k/n,cfg.ring?cy+Math.sin(ang)*rad:y,h,(k*(h==='A'?c.b:c.a))%n===0)}}
if(cfg.ring){const ang=phase*2*Math.PI-Math.PI/2;line(cx,cy,cx+Math.cos(ang)*(r+8),cy+Math.sin(ang)*(r+8),'#f5e5c9')}else line(pad+w*phase,11,pad+w*phase,height-11,'#f5e5c9')}
const labels={a:'A 軌拍數',b:'B 軌拍數',mode:'練習模式',hand:'單手評分軌',tolerance:'準確範圍',count:'預備拍數',limit:'循環數（0 持續循環）',quiet:'發聲／靜音各幾循環',offset:'輸入補償（ms）',grid:'細分格線',reduced:'減少動畫',ramp:'階梯加速',increment:'每階增加 BPM',stage:'每階循環數',max:'最高 BPM',volA:'A 軌音量 %',volB:'B 軌音量 %',toneA:'A 軌音色',toneB:'B 軌音色',muteA:'靜音 A 軌',muteB:'靜音 B 軌'};
function control(k,parent){const label=document.createElement('label');label.append(labels[k]);let el;if(choices[k]||k==='tolerance'){el=document.createElement('select');for(const v of choices[k]||[100,65,30])el.add(new Option(k==='tolerance'?({100:'寬鬆',65:'標準',30:'嚴格'}[v]+' ±'+v+' ms'):v,v))}else{el=document.createElement('input');if(limits[k]){el.type='number';[el.min,el.max]=limits[k]}else{el.type='checkbox';label.className='check'}}el.dataset.key=k;label.append(el);parent.append(label)}
for(const k of ['a','b'])control(k,$('custom'));for(const k of ['hand','tolerance','count','limit','quiet','toneA','toneB','volA','volB','muteA','muteB','grid','reduced','ramp','increment','stage','max','offset'])control(k,$('settings'));const md=document.querySelector('[data-key=mode]');choices.mode.forEach(m=>md.add(new Option(m,m)));
function refresh(){const cur=session?nowCycle(ctx.currentTime):null,c=cur?.cfg||cfg;const pend=session&&(pending.a!==undefined||Object.keys(pending).length||cycles.some(z=>z.n>cur.n&&(z.cfg.a!==c.a||z.cfg.b!==c.b||z.cfg.bpm!==c.bpm)));$('bigA').textContent=c.a;$('bigB').textContent=c.b;$('period').textContent=duration(c).toFixed(2)+' s ／ 循環 · '+c.bpm+' BPM';$('play').textContent=active?'Ⅱ 暫停':paused?'▶ 繼續':'▶ 播放';$('view').textContent=cfg.ring?'時間軸視圖':'環形視圖';$('status').textContent=paused?'已暫停':pend?'下個循環套用變更':active?(ctx.currentTime<session.start?'預備拍':c.mode==='靜音挑戰'&&Math.floor(cur.n/c.quiet)%2?'靜音循環':'播放中'):'準備就緒';$('counter').textContent='第 '+(cur?cur.n+1:0)+' 循環';$('tempo').value=cfg.bpm;const ratio=cfg.a+':'+cfg.b;$('ratio').value=!custom&&Array.from($('ratio').options).some(o=>o.value===ratio)?ratio:'自訂';$('custom').hidden=$('ratio').value!=='自訂';$('scoring').textContent=c.mode==='單手'?'聽 '+(c.hand==='A'?'B':'A')+' 軌，敲 '+c.hand+' 軌。評分 '+c.hand+' 軌。':c.mode==='雙手'?'預備拍後獨立維持兩軌。評分 A、B 軌。':'評分 A、B 兩軌。';for(const el of document.querySelectorAll('[data-key]')){if(el.type==='checkbox')el.checked=cfg[el.dataset.key];else el.value=cfg[el.dataset.key]}feedback();draw()}
$('ratio').onchange=e=>{custom=e.target.value==='自訂';if(custom)return refresh();const [a,b]=e.target.value.split(':').map(Number);change('a',a);change('b',b)};$('tempo').onchange=e=>{const v=+e.target.value;if(Number.isInteger(v)&&v>=30&&v<=200)change('bpm',v);else refresh()};
document.addEventListener('change',e=>{const el=e.target,k=el.dataset.key;if(!k)return;const val=el.type==='checkbox'?el.checked:limits[k]?Number(el.value):el.value;if(validConfig({...cfg,[k]:val}))change(k,val);else refresh()});
$('play').onclick=()=>active?pause():start();$('stop').onclick=()=>{cancelCal();finish()};$('restart').onclick=()=>{finish();start()};$('view').onclick=()=>change('ring',!cfg.ring);$('swap').onclick=()=>{[cfg.toneA,cfg.toneB]=[cfg.toneB,cfg.toneA];persist();refresh()};
document.querySelectorAll('[data-pad]').forEach(p=>{p.onpointerdown=e=>{e.preventDefault();tap(p.dataset.pad)};p.onclick=e=>{if(e.detail===0)tap(p.dataset.pad)}});document.addEventListener('keydown',e=>{if(e.repeat||e.ctrlKey||e.metaKey||e.altKey||e.target.closest('input,textarea,select,[contenteditable=true]')||$('practice').hidden)return;const h={KeyF:'A',KeyJ:'B'}[e.code];if(h){e.preventDefault();tap(h)}});
function tab(lesson){if(lesson){cancelCal();finish()}$('practice').hidden=lesson;$('lessons').hidden=!lesson;$('practiceTab').classList.toggle('sel',!lesson);$('lessonsTab').classList.toggle('sel',lesson);if(!lesson)refresh()}
$('practiceTab').onclick=()=>tab(false);$('lessonsTab').onclick=()=>tab(true);
const lessons=[['3:2 基礎','先只聽 B 拍，再以左手敲三等分。完成後切到雙手，保留同一個重合點。',3,2,60,8,'單手'],['4:3 均分','每三個 B 拍完成四個 A 拍，保持各軌間距一致。',4,3,54,8,'跟奏'],['5:4 五連音','以四個穩定脈搏承托五等分，重合拍放鬆雙手。',5,4,50,8,'跟奏'],['7:4 七等分','先唱出七個等距音，再逐步拿掉聲音提示。',7,4,48,8,'靜音挑戰'],['Math Rock 點弦','左手敲低音動機，右手模擬高音點弦。連續八循環保持兩手均勻。',5,3,60,8,'跟奏'],['Glitch Pop 切片','用 A 軌短促點擊對 B 軌短音，靜音時維持兩個打擊聲部。',7,4,66,8,'靜音挑戰']];
function load(c,title){cancelCal();finish();db.config={...c};cfg=db.config;custom=false;lessonName=title;$('title').textContent=title;persist();tab(false)}
for(const [title,goal,a,b,bpm,limit,mode] of lessons){const article=document.createElement('article');article.innerHTML='<h3></h3><p class="slim"></p><p class="mono"></p><button>載入練習</button>';article.children[0].textContent=title;article.children[1].textContent='練習目標 · '+goal;article.children[2].textContent=a+':'+b+' · '+bpm+' BPM · '+limit+' 循環';article.lastChild.onclick=()=>load({...defaults,reduced:cfg.reduced,offset:cfg.offset,a,b,bpm,limit,mode,toneA:title.startsWith('Glitch')?'點擊':'木魚'},title);$('lessonlist').append(article)}
function archive(){const box=$('archive');box.replaceChildren();for(const [group,list] of [['已儲存的練習',db.saved],['練習紀錄',db.history]]){const heading=document.createElement('h3');heading.textContent=group+'（'+list.length+'）';box.append(heading);for(const x of list){const row=document.createElement('div'),b=document.createElement('button'),info=document.createElement('p');row.className='listitem';const name=x.name||new Date(x.date).toLocaleString('zh-TW');b.textContent=name+' · 載入';b.onclick=()=>load(x.cfg,x.name||'紀錄重練');info.className='slim';info.textContent=x.cfg.a+':'+x.cfg.b+' · '+x.cfg.bpm+' BPM · '+x.cfg.mode+(x.seconds!==undefined?' · '+Math.round(x.seconds)+' 秒':'');row.append(b,info);if(x.stats)for(const h of ['A','B']){const p=document.createElement('p');p.className='slim';p.textContent=h+' 軌 · '+scoreText(x.stats[h]);row.append(p)}box.append(row)}}}
$('save').onclick=()=>{const name=$('name').value.trim()||cfg.a+':'+cfg.b+' '+cfg.mode;db.saved.unshift({name,cfg:{...cfg}});persist();archive();message('已儲存「'+name+'」。')};
$('export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='polyrhythm-lab.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};
$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const d=JSON.parse(await f.text());if(!validDB(d))throw Error();if(!confirm('以備份取代目前設定、自訂練習與紀錄？'))return;cancelCal();finish();db=d;cfg=d.config;lastStats=stats();persist();refresh();archive();message('已還原備份。')}catch{message('無法匯入，請選擇完整的交錯拍點備份。')}finally{e.target.value=''}};
$('clear').onclick=()=>{if(confirm('清除所有已完成的練習紀錄？')){db.history=[];persist();archive()}};
function cancelCal(){if(!cal)return;clearInterval(cal.timer);cal=null;if(bus){bus.disconnect();bus=null}$('calTap').hidden=true;$('cal').textContent='開始延遲校準'}
$('cal').onclick=async()=>{if(cal){cancelCal();return}finish();const gen=++generation;try{await audio();if(gen!==generation)return;freshBus();cal={first:ctx.currentTime+.4,next:0,last:-1,values:[]};$('calTap').hidden=false;$('cal').textContent='結束校準';$('calHelp').textContent='聽到節拍時點「跟著聲音敲擊」，或按 F，共八次。';cal.timer=setInterval(()=>{while(cal&&cal.first+cal.next*.65<ctx.currentTime+.12){const t=cal.first+cal.next++*.65;if(t>=ctx.currentTime-.02)tone(Math.max(t,ctx.currentTime),'B',defaults,65)}},24)}catch{message('無法啟動校準音訊。')}};
function calTap(){if(!cal)return;const dt=ctx.currentTime-cal.first,n=Math.round(dt/.65),diff=(dt-n*.65)*1000;if(n<0||n<=cal.last||Math.abs(diff)>250)return;cal.last=n;cal.values.push(diff);$('calHelp').textContent='已採集 '+cal.values.length+' / 8 次';if(cal.values.length===8){const v=cal.values.sort((a,b)=>a-b);cfg.offset=Math.round((v[3]+v[4])/2);cancelCal();persist();refresh();$('calHelp').textContent='輸入補償已設定為 '+cfg.offset+' ms。更換裝置後可重新校準。'}}
$('calTap').onpointerdown=e=>{e.preventDefault();calTap()};$('calTap').onclick=e=>{if(e.detail===0)calTap()};window.addEventListener('resize',draw);document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelCal();if(active)pause()}});window.addEventListener('pagehide',()=>{cancelCal();finish()});refresh();archive();
</script></body></html>
